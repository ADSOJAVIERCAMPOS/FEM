<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>FEM - Privacidad Radical</title>
    <style>
        :root {
            --bg-folicular: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            --bg-ovulacion: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --bg-lutea: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg-folicular); transition: background 2s ease; display: flex; justify-content: center; align-items: center; color: white; overflow: hidden; }
        .glass-container { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px; padding: 50px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 320px; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        h1 { font-size: 3.5rem; margin: 0; letter-spacing: 8px; font-weight: 200; }
        .btn-magic { background: white; color: #ff758c; border: none; padding: 18px 35px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; animation: pulse 2s infinite; margin-top: 20px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="badge">Versión Gratuita</div>
        <h1>FEM</h1>
        <p>Monitorea tu salud con privacidad radical. Sin correos, sin rastreo.</p>
        
        <div class="features">
            <span>🔒 Datos Locales</span>
            <span>📅 Calendario Inteligente</span>
        </div>

        <button class="btn-primary" onclick="iniciarPago()">✨ ACTIVAR MODO PRO ($100)</button>
        <a href="admin.html" class="admin-link">Acceso Admin</a>
    </div>

    <script>
        function iniciarPago() {
            const miWhatsApp = "573502284491"; 
            const transID = 'FEM-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            const mensaje = `¡Hola! Quiero activar FEM PRO por $100. ID: ${transID}`;
            window.location.href = `https://wa.me/${miWhatsApp}?text=${encodeURIComponent(mensaje)}`;
        }
    </script>
</body>
</html>
